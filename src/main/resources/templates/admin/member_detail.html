<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원 상세 정보</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #333;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .back-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .member-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .member-row {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .member-row:last-child {
            border-bottom: none;
        }

        .label {
            width: 150px;
            font-weight: bold;
            color: #555;
        }

        .value {
            flex: 1;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        .list-btn,
        .delete-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .list-btn {
            background: #333;
            color: white;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
        }
    </style>
</head>

<body>

<header class="header">

    <h1>맛따라 여행따라 관리자</h1>

    <button class="back-btn" onclick="goToMembers()">
        회원 목록으로
    </button>

</header>

<div class="container">

    <div class="title">
        <h2>👤 회원 상세 정보</h2>
        <p>회원의 상세 정보를 확인합니다.</p>
    </div>

    <div class="member-card">

        <div class="member-row">
            <div class="label">회원 번호</div>
            <div class="value" th:text="${member.id}"></div>
        </div>

        <div class="member-row">
            <div class="label">아이디</div>
            <div class="value" th:text="${member.username}"></div>
        </div>

        <div class="member-row">
            <div class="label">닉네임</div>
            <div class="value" th:text="${member.nickname}"></div>
        </div>

        <div class="member-row">
            <div class="label">보안 질문</div>
            <div class="value" th:text="${member.securityQuestion}"></div>
        </div>

        <div class="actions">

            <button class="list-btn" onclick="goToMembers()">
                회원 목록
            </button>

            <button class="delete-btn"
                    th:onclick="'deleteMember(' + ${member.id} + ')'">
                회원 삭제
            </button>

        </div>

    </div>

</div>

<script>

    function goToMembers() {
        location.href = "/api/admin/members";
    }

	function deleteMember(id) {

	    const confirmed = confirm("정말 이 회원을 삭제하시겠습니까?");

	    if (!confirmed) {
	        return;
	    }

	    fetch("/api/admin/members/" + id, {
	        method: "DELETE"
	    })
	    .then(response => {
	        if (!response.ok) {
	            throw new Error("회원 삭제에 실패했습니다.");
	        }

	        return response.text();
	    })
	    .then(message => {
	        alert(message);
	        location.href = "/api/admin/members";
	    })
	    .catch(error => {
	        alert(error.message);
	    });
	}

</script>

</body>

</html>
