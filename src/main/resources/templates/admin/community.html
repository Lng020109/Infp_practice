<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 관리</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .back-btn {
            border: none;
            background: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        .table-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }
        th {
            background: #f0f2f5;
            padding: 14px 10px;
            border-bottom: 1px solid #ddd;
        }
        td {
            padding: 13px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        td.title {
            text-align: left;
            max-width: 300px;
        }
        .delete-btn {
            border: none;
            background: #e74c3c;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
        .empty {
            padding: 50px;
            text-align: center;
            color: #888;
        }

        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
        }

        .pagination button {
            min-width: 38px;
            height: 38px;
            padding: 0 10px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .pagination button:hover {
            background: #f0f2f5;
        }

        .pagination button.active {
            background: #555;
            color: white;
            border-color: #555;
        }

        .pagination button:disabled {
            color: #aaa;
            background: #f5f5f5;
            cursor: default;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>💬 커뮤니티 관리</h1>

        <button class="back-btn"
                onclick="location.href='/api/admin/dashboard'">
            관리자 페이지로
        </button>
    </div>

    <div class="table-box">

        <table th:if="${posts != null and !posts.isEmpty()}">

            <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
                <th>조회수</th>
                <th>좋아요</th>
                <th>싫어요</th>
                <th>관리</th>
            </tr>
            </thead>

            <tbody id="postTableBody">
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}"></td>
                <td class="title"
                    th:text="${post.title}">
                </td>
                <td th:text="${post.username}"></td>
                <td th:text="${post.createdAt}"></td>
                <td th:text="${post.viewCount}"></td>
                <td th:text="${post.likeCount}"></td>
                <td th:text="${post.dislikeCount}"></td>
                <td>
                    <button class="delete-btn"
                            th:onclick="'deletePost(' + ${post.id} + ')'">
                        삭제
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty"
             th:if="${posts == null or posts.isEmpty()}">
            등록된 커뮤니티 게시글이 없습니다.
        </div>

        <!-- 페이지네이션 -->
        <div id="pagination"
             class="pagination"
             th:if="${posts != null and !posts.isEmpty()}">
        </div>
    </div>
</div>
<script>

    /* ================================
       페이지네이션
       한 페이지에 10개씩 표시
       ================================ */
    const rowsPerPage = 10;
    const tableBody = document.getElementById("postTableBody");
    const pagination = document.getElementById("pagination");

    if (tableBody && pagination) {
        const rows = Array.from(
            tableBody.querySelectorAll("tr")
        );
        const totalPages =
            Math.ceil(rows.length / rowsPerPage);
        let currentPage = 1;
        function showPage(page) {
            currentPage = page;
            const start =
                (page - 1) * rowsPerPage;
            const end =
                start + rowsPerPage;
            rows.forEach((row, index) => {
                if (index >= start && index < end) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
            createPagination();
        }
        function createPagination() {
            pagination.innerHTML = "";

            /* 이전 버튼 */
            const prevButton =
                document.createElement("button");
            prevButton.textContent = "‹";
            prevButton.disabled =
                currentPage === 1;
            prevButton.onclick = function () {
                if (currentPage > 1) {
                    showPage(currentPage - 1);
                }
            };
            pagination.appendChild(prevButton);

            /* 페이지 번호 */
            for (let i = 1; i <= totalPages; i++) {
                const pageButton =
                    document.createElement("button");
                pageButton.textContent = i;
                if (i === currentPage) {
                    pageButton.classList.add("active");
                }
                pageButton.onclick = function () {
                    showPage(i);
                };
                pagination.appendChild(pageButton);
            }

            /* 다음 버튼 */
            const nextButton =
                document.createElement("button");
            nextButton.textContent = "›";
            nextButton.disabled =
                currentPage === totalPages;
            nextButton.onclick = function () {
                if (currentPage < totalPages) {
                    showPage(currentPage + 1);
                }
            };
            pagination.appendChild(nextButton);
        }

        /* 처음 페이지 표시 */
        showPage(1);
    }

    /* ================================
       게시글 삭제
       기존 기능 그대로 유지
       ================================ */
    async function deletePost(id) {
        if (!confirm("정말 이 게시글을 삭제하시겠습니까?")) {return;}
        try {
            const response =
                await fetch(`/api/community/${id}`, {
                    method: "DELETE"
                });

            if (response.ok) {
                alert("게시글이 삭제되었습니다.");
                location.reload();
            } else {
                alert("게시글 삭제에 실패했습니다.");
            }
        } catch (error) {
            console.error(error);
            alert("삭제 중 오류가 발생했습니다.");
        }
    }

</script>
</body>
</html>
