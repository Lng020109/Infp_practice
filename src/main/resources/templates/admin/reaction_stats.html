<!DOCTYPE html>

<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>반응 통계</title>

    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================
           전체 배경
        ========================= */

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f6ff 0%,
                    #d7efff 45%,
                    #c6e6f9 100%
                );

            min-height: 100vh;

            color: #425b78;

            position: relative;

            overflow-x: hidden;
        }


        /* =========================
           배경 구름
        ========================= */

        .bg-clouds {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            overflow: hidden;

            z-index: 0;
        }

        .cloud {
            position: absolute;

            background: rgba(255, 255, 255, 0.60);

            border-radius: 100px;

            filter: blur(1px);
        }

        .cloud::before,
        .cloud::after {
            content: "";

            position: absolute;

            background: rgba(255, 255, 255, 0.60);

            border-radius: 50%;
        }


        /* 왼쪽 위 */

        .cloud-one {
            width: 330px;
            height: 85px;

            top: 11%;
            left: -90px;
        }

        .cloud-one::before {
            width: 125px;
            height: 125px;

            top: -62px;
            left: 65px;
        }

        .cloud-one::after {
            width: 150px;
            height: 150px;

            top: -75px;
            left: 150px;
        }


        /* 오른쪽 아래 */

        .cloud-two {
            width: 380px;
            height: 95px;

            bottom: 8%;
            right: -100px;
        }

        .cloud-two::before {
            width: 140px;
            height: 140px;

            top: -70px;
            left: 70px;
        }

        .cloud-two::after {
            width: 165px;
            height: 165px;

            top: -82px;
            left: 175px;
        }


        /* 작은 구름 */

        .cloud-three {
            width: 180px;
            height: 50px;

            top: 20%;
            right: 8%;

            opacity: 0.50;

            transform: scale(0.7);
        }


        /* =========================
           전체 컨테이너
        ========================= */

        .container {

            position: relative;

            z-index: 2;

            width: 90%;

            max-width: 1000px;

            margin: 45px auto 60px;
        }


        /* =========================
           상단 영역
        ========================= */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;
        }


        /* =========================
           제목
        ========================= */

        .title-area {

            display: flex;

            align-items: center;

            gap: 13px;
        }

        .title-icon {

            width: 48px;
            height: 48px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 15px;

            background: #eef7ff;

            border: 1px solid #d2e7f5;

            box-shadow:
                0 6px 14px rgba(100, 150, 185, 0.10);
        }

        .title-icon svg {

            width: 25px;
            height: 25px;

            fill: none;

            stroke: #91afd0;

            stroke-width: 1.6;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        .title-text {

            font-size: 23px;

            font-weight: 600;

            letter-spacing: -0.5px;

            color: #425b78;
        }

        .title-sub {

            margin-top: 4px;

            color: #92a6ba;

            font-size: 11px;
        }


        /* =========================
           대시보드 버튼
        ========================= */

        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 10px 16px;

            border: 1px solid rgba(255, 255, 255, 0.85);

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.72);

            color: #68829e;

            text-decoration: none;

            font-size: 12px;

            font-weight: 500;

            box-shadow:
                0 5px 13px rgba(100, 150, 185, 0.10);

            transition: all 0.2s ease;
        }

        .back-button:hover {

            background: #ffffff;

            transform: translateY(-1px);

            box-shadow:
                0 7px 16px rgba(100, 150, 185, 0.14);
        }

        .back-button svg {

            width: 15px;
            height: 15px;

            fill: none;

            stroke: #91afd0;

            stroke-width: 1.7;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =========================
           메인 패널
        ========================= */

        .main-panel {

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.92);

            border-radius: 26px;

            padding: 28px 30px 30px;

            box-shadow:
                0 16px 38px rgba(83, 132, 170, 0.13);

            backdrop-filter: blur(12px);
        }


        /* =========================
           요약
        ========================= */

        .summary {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 20px;

            color: #91a4b8;

            font-size: 12px;
        }

        .summary strong {

            color: #617b96;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           통계 테이블
        ========================= */

        .stats-table {

            width: 100%;

            border-collapse: separate;

            border-spacing: 0 8px;

            background: transparent;
        }


        .stats-table thead th {

            padding: 0 15px 8px;

            border: none;

            background: transparent;

            color: #9aabba;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 0.1px;
        }


        .stats-table tbody tr {

            background: #ffffff;

            box-shadow:
                0 4px 12px rgba(90, 140, 175, 0.07);
        }


        .stats-table tbody td {

            padding: 15px;

            border-top: 1px solid #edf3f7;

            border-bottom: 1px solid #edf3f7;

            color: #5c7188;

            font-size: 13px;
        }


        .stats-table tbody td:first-child {

            border-left: 1px solid #edf3f7;

            border-radius: 14px 0 0 14px;
        }


        .stats-table tbody td:last-child {

            border-right: 1px solid #edf3f7;

            border-radius: 0 14px 14px 0;
        }


        /* =========================
           순위
        ========================= */

        .rank {

            width: 90px;

            text-align: center !important;

            font-weight: 500;
        }


        .rank-number {

            width: 28px;
            height: 28px;

            margin: 0 auto;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #eef6fd;

            color: #86a5c2;

            font-size: 11px;

            font-weight: 600;
        }


        /* =========================
           이름
        ========================= */

        .name {

            text-align: left !important;

            font-weight: 500;

            color: #536b83 !important;
        }


        /* =========================
           반응 수
        ========================= */

        .count {

            width: 150px;

            text-align: center !important;
        }


        .count-pill {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 72px;

            padding: 7px 14px;

            border-radius: 999px;

            background: #e8f2ff;

            color: #7698ba;

            font-size: 11px;

            font-weight: 600;
        }


        /* =========================
           데이터 없음
        ========================= */

        .empty {

            padding: 55px 20px;

            text-align: center;

            border: 1px solid #edf3f7;

            border-radius: 18px;

            background: #ffffff;

            color: #9aaaba;

            font-size: 13px;
        }


        /* =========================
           페이지네이션
        ========================= */

        .pagination {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 6px;

            margin-top: 25px;
        }


        .pagination a,
        .pagination span {

            min-width: 34px;

            height: 34px;

            padding: 0 10px;

            display: inline-flex;

            justify-content: center;

            align-items: center;

            border-radius: 10px;

            text-decoration: none;

            font-size: 11px;
        }


        .pagination a {

            background: rgba(255, 255, 255, 0.78);

            color: #7791aa;

            border: 1px solid #e1ebf2;

            transition: all 0.2s ease;
        }


        .pagination a:hover {

            background: #ffffff;

            border-color: #cfe1ee;

            transform: translateY(-1px);
        }


        .pagination .current {

            background: #8fc8ee;

            color: white;

            border: 1px solid #8fc8ee;

            font-weight: 600;

            box-shadow:
                0 5px 12px rgba(116, 185, 255, 0.18);
        }


        /* =========================
           반응형
        ========================= */

        @media (max-width: 700px) {

            .container {

                width: calc(100% - 24px);

                margin-top: 25px;
            }

            .header {

                align-items: flex-start;

                gap: 15px;
            }

            .title-text {

                font-size: 20px;
            }

            .title-sub {

                font-size: 10px;
            }

            .back-button {

                padding: 9px 12px;

                white-space: nowrap;
            }

            .main-panel {

                padding: 22px 15px 24px;

                border-radius: 22px;
            }

            .stats-table thead th,
            .stats-table tbody td {

                padding-left: 9px;
                padding-right: 9px;
            }

            .rank {

                width: 55px;
            }

            .count {

                width: 95px;
            }

            .name {

                max-width: 180px;

                overflow: hidden;

                text-overflow: ellipsis;

                white-space: nowrap;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         배경 구름
    ========================= -->

    <div class="bg-clouds">

        <div class="cloud cloud-one"></div>

        <div class="cloud cloud-two"></div>

        <div class="cloud cloud-three"></div>

    </div>


    <!-- =========================
         전체 컨테이너
    ========================= -->

    <div class="container">


        <!-- =========================
             상단
        ========================= -->

        <div class="header">

            <div class="title-area">


                <!-- 맛집 아이콘 -->

                <div
                    class="title-icon"
                    th:if="${target == 'restaurant'}"
                >

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path d="M6 3v7"/>

                        <path d="M4 3v4"/>

                        <path d="M8 3v4"/>

                        <path d="M6 7v14"/>

                        <path d="M17 3
                                 c-2 1.5-3 3.7-3 6
                                 c0 2.3 1 3.5 3 3.5
                                 v8.5"/>

                        <path d="M17 3v10.5"/>

                    </svg>

                </div>


                <!-- 관광지 아이콘 -->

                <div
                    class="title-icon"
                    th:if="${target == 'tour'}"
                >

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path d="M3 20
                                 l6.5-9
                                 4 5
                                 2.5-3
                                 5 7"/>

                        <path d="M3 20h18"/>

                        <path d="M14.5 7.5
                                 a2 2 0 1 0 0-.1"/>

                    </svg>

                </div>


                <div>

                    <div class="title-text">

                        <!-- 맛집 -->

                        <span
                            th:if="${target == 'restaurant' and reaction == 'LIKE'}"
                        >
                            맛집 좋아요 순위
                        </span>

                        <span
                            th:if="${target == 'restaurant' and reaction == 'DISLIKE'}"
                        >
                            맛집 싫어요 순위
                        </span>


                        <!-- 관광지 -->

                        <span
                            th:if="${target == 'tour' and reaction == 'LIKE'}"
                        >
                            관광지 좋아요 순위
                        </span>

                        <span
                            th:if="${target == 'tour' and reaction == 'DISLIKE'}"
                        >
                            관광지 싫어요 순위
                        </span>

                    </div>


                    <div class="title-sub">
                        사용자 반응 통계
                    </div>

                </div>

            </div>


            <!-- 대시보드 버튼 -->

            <a
                th:href="@{/api/admin/dashboard}"
                class="back-button"
            >

                <svg
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >

                    <path d="M15 18
                             l-6-6
                             6-6"/>

                    <path d="M9 12h11"/>

                </svg>

                대시보드로

            </a>

        </div>


        <!-- =========================
             메인 패널
        ========================= -->

        <div class="main-panel">


            <!-- 총 개수 -->

            <div class="summary">

                총

                <strong th:text="${totalCount}">
                    0
                </strong>

                개

            </div>


            <!-- =========================
                 데이터가 있을 때
            ========================= -->

            <table
                class="stats-table"
                th:if="${!stats.isEmpty()}"
            >

                <thead>

                    <tr>

                        <th class="rank">
                            순위
                        </th>

                        <th>
                            이름
                        </th>

                        <th class="count">
                            반응 수
                        </th>
                    </tr>
                </thead>

                <tbody>

                    <tr
                        th:each="item, stat : ${stats}"
                    >

                        <td class="rank">

                            <div class="rank-number">
                                <span
                                    th:text="${currentPage * 10 + stat.index + 1}"
                                >
                                    1
                                </span>
                            </div>

                        </td>

                        <td
                            class="name"
                            th:text="${item.name}"
                        >
                            맛집 이름
                        </td>

                        <td class="count">
                            <span
                                class="count-pill"
                                th:text="${item.count}"
                            >
                                0
                            </span>
                        </td>
                    </tr>
                </tbody>

            </table>


            <!-- =========================
                 데이터가 없을 때
            ========================= -->

            <div
                class="empty"
                th:if="${stats.isEmpty()}"
            >
                아직 등록된 반응이 없습니다.
            </div>

            <!-- =========================
                 페이지 이동
            ========================= -->

            <div
                class="pagination"
                th:if="${totalPages > 1}"
            >

                <!-- 이전 -->

                <a
                    th:if="${currentPage > 0}"
                    th:href="@{/api/admin/reaction-stats/{target}/{reaction}
                        (target=${target}, reaction=${reaction}, page=${currentPage - 1})}"
                >
                    이전
                </a>

                <!-- 페이지 번호 -->

                <span
                    th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${pageNumber == currentPage} ? 'current' : ''"
                >

                    <a
                        th:if="${pageNumber != currentPage}"
                        th:href="@{/api/admin/reaction-stats/{target}/{reaction}
                            (target=${target}, reaction=${reaction}, page=${pageNumber})}"
                        th:text="${pageNumber + 1}"
                    >
                        1
                    </a>

                    <span
                        th:if="${pageNumber == currentPage}"
                        th:text="${pageNumber + 1}"
                    >
                        1
                    </span>

                </span>

                <!-- 다음 -->

                <a
                    th:if="${currentPage < totalPages - 1}"
                    th:href="@{/api/admin/reaction-stats/{target}/{reaction}
                        (target=${target}, reaction=${reaction}, page=${currentPage + 1})}"
                >
                    다음
                </a>

            </div>

        </div>

    </div>

</body>

</html>
