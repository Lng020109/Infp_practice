<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
    }

    .login-box {
        width: 350px;
        padding: 40px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: #333;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #555;
    }

    #message {
        margin-top: 15px;
        text-align: center;
    }
</style>

</head>

<body>

<div class="login-box">

<h1>관리자 로그인</h1>

<input
    type="text"
    id="username"
    placeholder="관리자 아이디">

<input
    type="password"
    id="password"
    placeholder="관리자 비밀번호">

<button onclick="adminLogin()">로그인</button>

<div id="message"></div>

</div>

<script>
    async function adminLogin() {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        try {

            const response = await fetch("/api/admin/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const result = await response.text();

			if (response.ok) {

			    sessionStorage.setItem("adminLoggedIn", "true");

			    location.href = "/api/admin/dashboard";

			} else {

			    message.textContent = result;
			}

        } catch (error) {

            message.textContent =
                "서버와 연결할 수 없습니다.";
        }
    }
</script>

</body>
</html>
