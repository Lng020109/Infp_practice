<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마이페이지 - 맛따라 여행따라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f7fb;color:#202936;font-family:"Noto Sans KR",sans-serif;overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.header{position:sticky;top:0;z-index:100;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(255,255,255,.96);border-bottom:1px solid #e7ecf2;backdrop-filter:blur(12px)}.header button{height:42px;border:0;border-radius:12px}.back{width:42px;background:#eef3f8;color:#315b9c;font-size:17px}.home{padding:0 13px;background:#315b9c;color:#fff;font-size:13px;font-weight:700}.logo{font-size:17px;font-weight:800;color:#315b9c}.wrap{max-width:720px;margin:auto;padding:24px 15px 90px}.title{margin:0;font-size:25px;font-weight:800;letter-spacing:-1px}.subtitle{margin:7px 0 22px;color:#7e8998;font-size:13px}.card{background:#fff;border:1px solid #e7ecf2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px rgba(49,91,156,.05)}.section-title{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:17px;font-weight:800}.section-title i{color:#315b9c}.profile{display:flex;align-items:center;gap:14px;margin-bottom:15px}.profile img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid #edf2f8;background:#edf2f7}.profile-info{min-width:0}.nickname{margin:0 0 3px;font-size:19px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.userid{font-size:12px;color:#8b96a4;word-break:break-all}.image-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.small{min-height:40px;border:0;border-radius:10px;background:#eef3f9;color:#315b9c;font-size:12px;font-weight:700}.small.danger{background:#fff0f0;color:#d14d4d}.field{margin-bottom:13px}.field label{display:block;margin-bottom:7px;color:#475365;font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid #dce3ec;border-radius:11px;outline:0;background:#fff;color:#263140;font-size:14px}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6e94c8;box-shadow:0 0 0 3px rgba(49,91,156,.08)}.primary{width:100%;min-height:48px;border:0;border-radius:12px;background:#315b9c;color:#fff;font-size:14px;font-weight:800}.withdraw{width:100%;min-height:46px;margin-top:10px;border:1px solid #efcaca;border-radius:12px;background:#fff7f7;color:#cf4545;font-size:13px;font-weight:700}.list{max-height:450px;overflow-y:auto;-webkit-overflow-scrolling:touch}.empty{text-align:center;padding:28px 8px;color:#99a3b0;font-size:13px}.review,.reaction,.post{padding:14px 0;border-bottom:1px solid #edf0f4}.review:first-child,.reaction:first-child,.post:first-child{padding-top:0}.review:last-child,.reaction:last-child,.post:last-child{border-bottom:0;padding-bottom:0}.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;margin-right:5px;border-radius:20px;background:#edf3fb;color:#315b9c;font-size:10px;font-weight:800}.item-title{margin:0 0 5px;font-size:14px;font-weight:800}.meta{margin-bottom:8px;color:#96a0ad;font-size:11px}.content{margin:0;color:#4d5867;font-size:13px;line-height:1.65;word-break:break-word}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions button{min-height:38px;border:0;border-radius:9px;background:#f1f4f8;color:#536071;font-size:11px;font-weight:700}.actions .del{background:#fff1f1;color:#d14d4d}.reaction{display:flex;gap:12px}.reaction-icon{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#eef3fa;color:#315b9c}.reaction-icon.dislike{background:#fff0f0;color:#d14d4d}.reaction-body{min-width:0;flex:1}.post{cursor:pointer}.post-top{display:flex;align-items:center;gap:10px}.post img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#edf2f7}.post-info{min-width:0;flex:1}.post-title{margin:0 0 3px;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.post-date{color:#98a2af;font-size:10px}.post-preview{margin:9px 0 0 48px;color:#687383;font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:90;height:64px;display:grid;grid-template-columns:1fr 1fr 1fr;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97);border-top:1px solid #e6ebf1;backdrop-filter:blur(12px)}.bottom button{border:0;background:transparent;color:#8994a2;font-size:10px;font-weight:700}.bottom i{display:block;margin-bottom:4px;font-size:17px}.bottom .active{color:#315b9c}.toast{position:fixed;left:50%;bottom:80px;z-index:200;max-width:calc(100% - 32px);padding:11px 15px;border-radius:11px;background:rgba(30,39,51,.92);color:#fff;font-size:12px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<header class="header"><button class="back" onclick="location.href='/mobile'"><i class="fa-solid fa-arrow-left"></i></button><div class="logo">맛따라 여행따라</div><button class="home" onclick="location.href='/mobile'"><i class="fa-solid fa-house"></i></button></header>
<main class="wrap">
<h1 class="title">마이페이지</h1><p class="subtitle">내 정보와 활동을 한곳에서 관리해보세요.</p>
<section class="card"><h2 class="section-title"><i class="fa-solid fa-user"></i> 회원 정보</h2>
<div class="profile"><img id="profile-image-preview" src="https://via.placeholder.com/150?text=PROFILE" alt="프로필 이미지"><div class="profile-info"><p class="nickname" id="profile-nickname">사용자</p><div class="userid" id="profile-username"></div></div></div>
<div class="image-buttons"><button class="small" onclick="document.getElementById('profile-image-input').click()"><i class="fa-solid fa-camera"></i> 사진 변경</button><button class="small danger" onclick="deleteProfileImage()"><i class="fa-solid fa-trash"></i> 사진 삭제</button></div><input type="file" id="profile-image-input" accept="image/*" style="display:none" onchange="uploadProfileImage(this)">
<div class="field"><label>아이디</label><input id="username" type="text" readonly></div><div class="field"><label>닉네임</label><input id="nickname" type="text"></div><div class="field"><label>새 비밀번호</label><input id="password" type="password" placeholder="변경할 때만 입력"></div><div class="field"><label>새 비밀번호 확인</label><input id="password-confirm" type="password" placeholder="새 비밀번호를 다시 입력"></div>
<div class="field">
    <label>보안 질문</label>
    <select id="security-question">
        <option value="">선택해주세요</option>
        <option value="가장 기억에 남는 장소는?">가장 기억에 남는 장소는?</option>
        <option value="가장 좋아하는 음식은?">가장 좋아하는 음식은?</option>
        <option value="나의 어릴 적 별명은?">나의 어릴 적 별명은?</option>
        <option value="나의 보물 1호는?">나의 보물 1호는?</option>
    </select>
</div>

<div class="field">
    <label>보안 질문 답변</label>
    <input id="security-answer" type="text">
</div>
<button class="primary" onclick="updateMember()"><i class="fa-solid fa-floppy-disk"></i> 정보 수정</button><button class="withdraw" onclick="deleteMember()"><i class="fa-solid fa-user-xmark"></i> 회원 탈퇴</button>
</section>
<section class="card"><h2 class="section-title"><i class="fa-solid fa-pen"></i> 내가 작성한 리뷰</h2><div id="my-reviews" class="list"><div class="empty">리뷰를 불러오는 중...</div></div></section>
<section class="card"><h2 class="section-title"><i class="fa-solid fa-heart"></i> 나의 좋아요 / 싫어요</h2><div id="my-reactions" class="list"><div class="empty">반응을 불러오는 중...</div></div></section>
<section class="card"><h2 class="section-title"><i class="fa-solid fa-comments"></i> 내가 작성한 커뮤니티 글</h2><div id="my-community-posts" class="list"><div class="empty">게시글을 불러오는 중...</div></div></section>
</main>
<nav class="bottom"><button onclick="location.href='/mobile'"><i class="fa-solid fa-map-location-dot"></i>여행</button><button onclick="location.href='/mobile#playlist'"><i class="fa-solid fa-music"></i>플레이리스트</button><button class="active"><i class="fa-solid fa-user"></i>마이페이지</button></nav><div id="toast" class="toast"></div>
<script>
let currentLoggedInUser=null,currentMember=null,myReviews=[];
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
function esc(v){return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function date(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'})}
function user(){try{return JSON.parse(localStorage.getItem('currentLoggedInUser'))}catch(e){return null}}
document.addEventListener('DOMContentLoaded',()=>{currentLoggedInUser=user();if(!currentLoggedInUser){alert('로그인이 필요합니다.');location.href='/mobile';return}const u=currentLoggedInUser.username||currentLoggedInUser.userName||currentLoggedInUser.id;if(!u){alert('로그인 정보를 확인할 수 없습니다.');location.href='/mobile';return}loadMember(u).then(()=>loadMyReviews(u));loadMyReactions(u);loadMyCommunityPosts(u)});
async function loadMember(u){try{const r=await fetch('/api/member/'+encodeURIComponent(u));if(!r.ok)throw Error();currentMember=await r.json();document.getElementById('username').value=currentMember.username||u;document.getElementById('nickname').value=currentMember.nickname||'';document.getElementById('profile-nickname').textContent=currentMember.nickname||u;document.getElementById('profile-username').textContent='@'+(currentMember.username||u);document.getElementById('security-question').value=currentMember.securityQuestion||'';document.getElementById('security-answer').value=currentMember.securityAnswer||'';await loadProfileImage(u)}catch(e){console.error(e);toast('회원 정보를 불러오지 못했습니다.')}}
async function updateMember(){const u=document.getElementById('username').value,n=document.getElementById('nickname').value.trim(),p=document.getElementById('password').value,pc=document.getElementById('password-confirm').value,q=document.getElementById('security-question').value,a=document.getElementById('security-answer').value.trim();if(!n)return toast('닉네임을 입력해주세요.');if(p!==pc)return toast('비밀번호가 일치하지 않습니다.');try{const r=await fetch('/api/member/'+encodeURIComponent(u),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,nickname:n,password:p,securityQuestion:q,securityAnswer:a})});if(!r.ok)throw Error(await r.text());let data=null;try{data=await r.json()}catch(e){}currentLoggedInUser={...(currentLoggedInUser||{}),username:u,nickname:data?.nickname||n};localStorage.setItem('currentLoggedInUser',JSON.stringify(currentLoggedInUser));document.getElementById('profile-nickname').textContent=currentLoggedInUser.nickname;document.getElementById('password').value='';document.getElementById('password-confirm').value='';toast('회원 정보가 수정되었습니다.')}catch(e){console.error(e);toast('회원 정보 수정 중 오류가 발생했습니다.')}}
async function deleteMember(){const u=document.getElementById('username').value;if(!confirm('회원 탈퇴를 진행하시겠습니까?\n탈퇴 후에는 계정을 복구할 수 없습니다.'))return;try{const r=await fetch('/api/member/'+encodeURIComponent(u),{method:'DELETE'});if(!r.ok)throw Error();localStorage.removeItem('currentLoggedInUser');alert('회원 탈퇴가 완료되었습니다.');location.href='/mobile'}catch(e){console.error(e);toast('회원 탈퇴 중 오류가 발생했습니다.')}}
async function loadProfileImage(u){try{const r=await fetch('/api/member/'+encodeURIComponent(u)+'/profile-image');if(!r.ok)return;const b=await r.blob();if(b.size)document.getElementById('profile-image-preview').src=URL.createObjectURL(b)}catch(e){}}
async function uploadProfileImage(input){const f=input.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('이미지 파일만 업로드할 수 있습니다.');input.value='';return}const u=document.getElementById('username').value,fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/member/'+encodeURIComponent(u)+'/profile-image',{method:'PUT',body:fd});if(!r.ok)throw Error();document.getElementById('profile-image-preview').src=URL.createObjectURL(f);toast('프로필 사진이 변경되었습니다.')}catch(e){console.error(e);toast('프로필 사진 변경 중 오류가 발생했습니다.')}finally{input.value=''}}
async function deleteProfileImage(){const u=document.getElementById('username').value;if(!confirm('프로필 사진을 삭제하시겠습니까?'))return;try{const r=await fetch('/api/member/'+encodeURIComponent(u)+'/profile-image',{method:'DELETE'});if(!r.ok)throw Error();document.getElementById('profile-image-preview').src='https://via.placeholder.com/150?text=PROFILE';toast('프로필 사진이 삭제되었습니다.')}catch(e){console.error(e);toast('프로필 사진 삭제 중 오류가 발생했습니다.')}}
async function loadMyReviews(u){const box=document.getElementById('my-reviews');try{const nick=currentMember?.nickname||currentLoggedInUser?.nickname||'';const [rr,tr]=await Promise.all([fetch('/api/reviews/my/'+encodeURIComponent(u)),fetch('/api/tour-reviews/my/'+encodeURIComponent(nick))]);const rs=rr.ok?await rr.json():[],ts=tr.ok?await tr.json():[];myReviews=[...(Array.isArray(rs)?rs:[]).map(x=>({...x,reviewType:'RESTAURANT',placeName:x.placeName||x.restaurantName||x.place||'맛집'})),...(Array.isArray(ts)?ts:[]).map(x=>({...x,reviewType:'TOUR',placeName:x.placeName||x.tourName||x.touristName||x.place||'관광지'}))];myReviews.sort((a,b)=>new Date(b.createdAt||b.date||0)-new Date(a.createdAt||a.date||0));if(!myReviews.length){box.innerHTML='<div class="empty">작성한 리뷰가 없습니다.</div>';return}box.innerHTML=myReviews.map((x,i)=>`<article class="review"><h3 class="item-title"><span class="badge">${x.reviewType==='TOUR'?'관광지':'맛집'}</span>${esc(x.placeName)}</h3><div class="meta">${date(x.createdAt||x.date)}</div><p class="content">${esc(x.content||x.reviewContent||x.text||'')}</p><div class="actions"><button onclick="editMyReview(${i})"><i class="fa-solid fa-pen"></i> 수정</button><button class="del" onclick="deleteMyReview(${i})"><i class="fa-solid fa-trash"></i> 삭제</button></div></article>`).join('')}catch(e){console.error(e);box.innerHTML='<div class="empty">리뷰를 불러오지 못했습니다.</div>'}}
async function editMyReview(i){const x=myReviews[i];if(!x)return;const old=x.content||x.reviewContent||x.text||'';const content=prompt('리뷰 내용을 수정해주세요.',old);if(content===null)return;if(!content.trim())return toast('리뷰 내용을 입력해주세요.');try{let r;if(x.reviewType==='TOUR'){r=await fetch('/api/tour-reviews/'+x.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content.trim(),writer:currentMember?.nickname||currentLoggedInUser?.nickname||''})})}else{r=await fetch('/api/reviews/'+x.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content.trim(),username:currentMember?.username||currentLoggedInUser?.username||''})})}if(!r.ok)throw Error();toast('리뷰가 수정되었습니다.');await loadMyReviews(document.getElementById('username').value)}catch(e){console.error(e);toast('리뷰 수정 중 오류가 발생했습니다.')}}
async function deleteMyReview(i){const x=myReviews[i];if(!x||!confirm('이 리뷰를 삭제하시겠습니까?'))return;try{let r;if(x.reviewType==='TOUR'){r=await fetch('/api/tour-reviews/'+x.id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({writer:currentMember?.nickname||currentLoggedInUser?.nickname||''})})}else{r=await fetch('/api/reviews/'+x.id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentMember?.username||currentLoggedInUser?.username||''})})}if(!r.ok)throw Error();toast('리뷰가 삭제되었습니다.');await loadMyReviews(document.getElementById('username').value)}catch(e){console.error(e);toast('리뷰 삭제 중 오류가 발생했습니다.')}}
async function loadMyReactions(u){const box=document.getElementById('my-reactions');try{const r=await fetch('/api/reactions/my/'+encodeURIComponent(u));if(!r.ok)throw Error();const data=await r.json();const list=Array.isArray(data)?data.filter(x=>x.reaction==='LIKE'||x.reaction==='DISLIKE'):[];if(!list.length){box.innerHTML='<div class="empty">좋아요 / 싫어요 기록이 없습니다.</div>';return}box.innerHTML=list.map(x=>{const like=x.reaction==='LIKE';return `<article class="reaction"><div class="reaction-icon ${like?'':'dislike'}"><i class="fa-solid ${like?'fa-thumbs-up':'fa-thumbs-down'}"></i></div><div class="reaction-body"><h3 class="item-title">${esc(x.placeName||x.restaurantName||x.place||'장소')}</h3><div class="meta">${like?'좋아요':'싫어요'}${x.createdAt?' · '+date(x.createdAt):''}</div>${x.latestReview?`<p class="content">${esc(x.latestReview)}</p>`:''}</div></article>`}).join('')}catch(e){console.error(e);box.innerHTML='<div class="empty">반응을 불러오지 못했습니다.</div>'}}
async function loadMyCommunityPosts(u){const box=document.getElementById('my-community-posts');try{const r=await fetch('/api/community/my/'+encodeURIComponent(u));if(!r.ok)throw Error();const posts=await r.json();if(!Array.isArray(posts)||!posts.length){box.innerHTML='<div class="empty">작성한 커뮤니티 글이 없습니다.</div>';return}box.innerHTML=posts.map(p=>`<article class="post" onclick="location.href='/community?id=${encodeURIComponent(p.id)}'"><div class="post-top"><img src="${esc(p.profileImage||p.profile_image||'https://via.placeholder.com/100?text=USER')}" alt="프로필"><div class="post-info"><h3 class="post-title">${esc(p.title||p.subject||'제목 없음')}</h3><div class="post-date">${date(p.createdAt||p.date)}</div></div><i class="fa-solid fa-chevron-right" style="color:#a5afbb;font-size:12px"></i></div><p class="post-preview">${esc(p.content||p.text||'')}</p></article>`).join('')}catch(e){console.error(e);box.innerHTML='<div class="empty">커뮤니티 글을 불러오지 못했습니다.</div>'}}
</script>
</body>
</html>
